<!-- BBY community (Drops) -->
<dialog class="bb-dialog" id="dlg-community" aria-labelledby="cm-h">
  <div class="bb-dialog__in">
    <button class="bb-dialog__x" type="button" data-close aria-label="Close">×</button>
    <h2 id="cm-h">Join the BBY community</h2>
    <p>Help decide what comes on our menu next: what drops, and which burger we launch.</p>
    <form class="bb-form" method="post" action="#" novalidate data-community>
      <div class="bb-field"><label for="cm-name">Name</label><input id="cm-name" name="name" autocomplete="name" required aria-describedby="cm-name-err"><p class="bb-field__err" id="cm-name-err"></p></div>
      <div class="row2">
        <div class="bb-field"><label for="cm-phone">Phone</label><input id="cm-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91 98765 43210" required aria-describedby="cm-phone-err"><p class="bb-field__err" id="cm-phone-err"></p></div>
        <div class="bb-field"><label for="cm-email">Email</label><input id="cm-email" name="email" type="email" autocomplete="email" required aria-describedby="cm-email-err"><p class="bb-field__err" id="cm-email-err"></p></div>
      </div>
      <div class="bb-field"><label for="cm-loc">Location</label>
        <select id="cm-loc" name="location" required aria-describedby="cm-loc-err"><option value="">Choose your city</option><option>Bangalore</option><option>Delhi NCR</option><option>Mumbai</option><option>Other</option></select>
        <p class="bb-field__err" id="cm-loc-err"></p></div>
      <div class="bb-field">
        <label class="bb-check" for="cm-consent"><input id="cm-consent" name="consent" type="checkbox" required aria-describedby="cm-consent-err"><span>I agree to receive drop updates on WhatsApp, SMS, and email. I can unsubscribe at any time.</span></label>
        <p class="bb-field__err" id="cm-consent-err"></p>
      </div>
      <div><button class="bb-btn" type="submit">Join the community</button></div>
    </form>
    <div class="bb-done" data-community-done hidden tabindex="-1">
      <p>You’re in. We’ll ask you before the next one drops.</p>
      <small data-community-test hidden>Test mode: FORM_ENDPOINT is not set in config/site.js, so nothing was sent.</small>
    </div>
  </div>
</dialog>
